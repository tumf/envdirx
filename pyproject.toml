[project]
name = "envdirx"
version = "0.1.0"
description = "Store DJB envdir entries as plaintext or encrypted files with an external private key"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["envdir", "environment-variables", "encryption", "cli"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
]
authors = [
    { name = "tumf", email = "tumf@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.2",
]

[project.urls]
Repository = "https://github.com/tumf/envdirx"

[project.scripts]
envdirx = "envdirx:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["README.ja.md"]
