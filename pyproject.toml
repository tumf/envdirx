[project]
name = "envdirx"
version = "0.1.0"
description = "Encrypt DJB envdir entries with an external private key"
authors = [
    { name = "tumf", email = "tumf@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.2",
]

[project.scripts]
envdirx = "envdirx:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
